# Runs the Stepwise tests on every push and pull request.
name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Problem generators, questions and study guides
        run: node test/test-problems.js
      - name: Formula solver
        run: node test/test-solver.js
      - name: CS A tracing problems run as real Java
        run: node test/test-java.js
      - name: Tab Mixer extension zip is up to date
        run: python3 tools/build-tab-mixer.py --check
